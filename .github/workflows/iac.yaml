name: build and package a model to container hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML Extension
        run: az extension add -n ml -y

      - name: Configure Azure ML Defaults
        run: |
          az configure --defaults group="anukhajuria089-rg" workspace="Practical-mlops-book"

      - name: Retrieve the model
        run: |
          az ml model download --name "roberta-sequence" --version 1 --download-path "."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry 
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io 
          username: ${{ github.repository_owner }} 
          password: ${{ secrets.GH_REGISTRY }}

      - name: Build flask-app and push to registry 
        uses: docker/build-push-action@v6
        with: 
          context: ./ 
          tags: ghcr.io/${{ github.repository_owner }}/mlops-chap-4:latest 
          push: true

